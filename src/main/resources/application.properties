spring.application.name=catalogo-botanico

# ---- Servidor ----
server.port=8081

# ---- Fuente de datos ----
spring.datasource.url=jdbc:postgresql://localhost:5432/florav1
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- Datos de ejemplo (data.sql) ----
# defer-datasource-initialization: espera a que Hibernate cree las tablas
# antes de correr data.sql (si no, el INSERT falla porque la tabla no existe).
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ---- Flyway (desactivado por ahora) ----
spring.flyway.enabled=false
spring.application.name=catalogo-botanico

# ---- Servidor ----
server.port=8080

# ---- Fuente de datos ----
spring.datasource.url=jdbc:postgresql://localhost:5432/florav1
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=validate
# ---- Eso significa que al arrancar, Hibernate compara cada @Entity contra la base real. Si algo no coincide, la aplicación no arranca ----

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ---- Flyway
# Las migraciones en db/migration/ se aplican automáticamente al arrancar.
# baseline-version=3 porque V2 y V3 ya fueron aplicadas manualmente.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=3